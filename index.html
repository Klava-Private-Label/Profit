<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Klava Private Label</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f4f5f7; --panel:#fff; --ink:#1b2330; --muted:#677385; --line:#e3e6eb; --line2:#eef0f3;
    --navy:#21334d; --navy2:#2d4466; --accent:#c9822b; --pos:#1f7a4d; --neg:#b3372f; --warn:#a86a00;
    --cr:#0f2f6b; --db:#7f1414; --cr-bg:#e6edf8; --db-bg:#f8e7e7; --pos-bg:#e6f4ec; --neg-bg:#fbeceb; --warn-bg:#fdf3e0; --info-bg:#e9eef6;
    --radius:10px; --shadow:0 1px 2px rgba(20,30,50,.06),0 2px 8px rgba(20,30,50,.05);
  }
  *{box-sizing:border-box}
  body,input,select,textarea,button,option,a{text-transform:uppercase}
  input[type=email]{text-transform:lowercase}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Inter",-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  a{color:var(--navy2)}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit}
  .app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
  nav{background:var(--navy);color:#dfe6f0;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
  nav .brand{font-weight:700;font-size:16px;color:#fff;padding:4px 10px 2px;letter-spacing:.2px}
  nav .sub{font-size:11px;color:#9fb0c7;padding:0 10px 16px;text-transform:uppercase;letter-spacing:.8px}
  nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;display:flex;align-items:center;gap:10px;color:#cfd8e6}
  nav button:hover{background:rgba(255,255,255,.07)}
  nav button.on{background:rgba(255,255,255,.13);color:#fff;font-weight:600}
  nav .sp{flex:1}
  nav .foot{font-size:11px;color:#8b9bb2;padding:8px 10px;line-height:1.6}
  nav .foot a{color:#c8d4e5}
  nav button i{font-style:normal;width:16px;text-align:center}
  td.wrap{overflow-wrap:anywhere;word-break:break-word} td .mono{overflow-wrap:anywhere}
  td.mg{white-space:normal;min-width:84px} td.mg .badge{white-space:normal;text-align:center}
  td.stk .badge{display:table;margin:0 0 3px}
  /* telas menores: menu lateral só com ícones, para as tabelas caberem sem rolagem horizontal */
  @media (max-width:1560px){
    .app{grid-template-columns:60px minmax(0,1fr)}
    nav{padding:18px 8px} nav .brand,nav .sub,nav button span,nav .foot{display:none}
    nav button{justify-content:center;padding:11px 0;font-size:16px}
    main{padding:20px 18px 60px}
  }
  @media (max-width:1300px){ table{font-size:12px} th,td{padding:6px 5px} .badge{padding:2px 6px;font-size:10.5px} .ellip{max-width:150px} }
  main{padding:22px 28px 60px;min-width:0}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .top h1{font-size:21px;margin:0;font-weight:700;letter-spacing:-.2px}
  .top .grow{flex:1}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .btn:hover{border-color:#c7ccd4}
  .btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.pri:hover{background:var(--navy2)}
  .btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn.ghost:hover{color:var(--ink);background:var(--line2)}
  .btn.danger{color:var(--neg)}
  .btn:disabled{opacity:.5;cursor:default}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .kpis.row{grid-template-columns:repeat(var(--n,5),minmax(0,1fr))}
  .kpis.row .kpi{padding:12px 14px}
  .kpis.row .kpi .v{font-size:clamp(14px,1.15vw,18px)}
  @media (max-width:1100px){.kpis.row{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @media (max-width:700px){.kpis.row{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .desc textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;resize:vertical;min-height:44px;background:#fff}
  .desc label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:0 0 4px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .kpi{padding:14px 16px}
  .kpi .l{font-size:12px;color:var(--muted)}
  .kpi .v{font-size:18px;letter-spacing:-.2px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
  .section{margin-top:22px}
  .section h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  h2.sub{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin:18px 0 8px;display:flex;gap:8px;align-items:baseline}
  h2.sub:first-of-type{margin-top:4px}
  h2.sub .c{font-weight:400;color:var(--muted);font-size:12px;text-transform:none}
  .section h2 .c{font-weight:400;color:var(--muted);font-size:13px}
  .two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .grid>*{min-width:0}
  @media (max-width:1700px){.two{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 7px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.3px;line-height:1.25;color:var(--muted);font-weight:600;background:#fafbfc;position:sticky;top:0;z-index:1}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  th.n{white-space:normal}
  th:first-child,td:first-child{padding-left:12px} th:last-child,td:last-child{padding-right:12px}
  tr.click{cursor:pointer}
  tr.click:hover td{background:#f8f9fb}
  tfoot td{font-weight:700;background:#fafbfc}
  .tbl{overflow-y:auto;overflow-x:hidden;max-height:calc(100vh - 170px);min-height:240px}
  .card{overflow-x:hidden}
  main>.card.tbl{margin-bottom:0}
  .tbl.short{max-height:360px;min-height:0}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .neg{color:var(--neg)} .pos{color:var(--pos)}
  /* créditos (recebimentos) em azul escuro, débitos (pagamentos) em vermelho escuro */
  tr.cr>td,td.cr,.kpi.cr .v,.cr-t{color:var(--cr)} tr.db>td,td.db,.kpi.db .v,.db-t{color:var(--db)}
  td.cr,td.db,tr.cr td.n,tr.db td.n{font-weight:600}
  tr.cr .code,tr.cr .mono{color:var(--cr)} tr.db .code,tr.db .mono{color:var(--db)}
  tr.cr>td.saldo,tr.db>td.saldo{color:var(--ink)}
  .sug{margin-top:4px;font-size:12px;background:var(--info-bg);border-radius:6px;padding:4px 7px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .sug.baixa{background:var(--warn-bg)} .sug b{font-weight:700}
  .cand{max-height:46vh;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
  .cand table td,.cand table th{padding:5px 6px}
  .somabar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:10px 0;font-size:13px}
  .somabar b{font-variant-numeric:tabular-nums}
  .kpi.click{cursor:pointer} .kpi.click.on{border-color:var(--navy);box-shadow:0 0 0 2px rgba(33,51,77,.15)}
  .kpi.bk{cursor:pointer;border:1px solid var(--line)} .kpi.bk:hover{border-color:#b9c3d3} .kpi.bk.on{border-color:var(--navy);box-shadow:0 0 0 2px rgba(33,51,77,.15)}
  .badge.b-prop{background:#efe7fb;color:#5b2d9e}
  .badge.b-cr{background:var(--cr-bg);color:var(--cr)} .badge.b-db{background:var(--db-bg);color:var(--db)}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--line2);color:var(--muted)}
  .b-pos{background:var(--pos-bg);color:var(--pos)} .b-neg{background:var(--neg-bg);color:var(--neg)}
  .b-warn{background:var(--warn-bg);color:var(--warn)} .b-info{background:var(--info-bg);color:var(--navy2)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .filters input,.filters select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;min-width:140px}
  .filters input[type=search]{min-width:240px}
  .empty{padding:28px;text-align:center;color:var(--muted)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .code{font-weight:600}
  td .code,td.code{white-space:normal;overflow-wrap:anywhere}
  .selplus{display:flex;gap:6px}.selplus select{flex:1;min-width:0}.selplus .btn{font-size:18px;line-height:1;padding:6px 12px}
  .addtipo{gap:6px;margin-top:6px}.addtipo input{flex:1;min-width:0}
  .ellip{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* drawer */
  .shade{position:fixed;inset:0;background:rgba(20,28,40,.35);z-index:20;display:none}
  .shade.on{display:block}
  .drawer{position:fixed;inset:0;width:100vw;background:var(--bg);z-index:21;transform:translateX(100%);transition:transform .2s ease;overflow:auto}
  .drawer.on{transform:none}
  .drawer .hd{background:#fff;border-bottom:1px solid var(--line);padding:16px 28px;position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:flex-start}
  .drawer .hd h2{margin:0;font-size:18px}
  .drawer .bd{padding:20px 28px 60px}
  .meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--muted)}
  .meta b{color:var(--ink);font-weight:600}
  .bar{height:8px;border-radius:5px;background:var(--line2);overflow:hidden;display:flex}
  .bar i{display:block;height:100%}
  /* modal */
  .modal{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;z-index:40;background:rgba(20,28,40,.4);padding:40px 16px;overflow:auto}
  .modal.on{display:flex}
  .modal .box{background:#fff;border-radius:12px;width:min(680px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal .box header{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px;display:flex;align-items:center}
  .modal .box header .grow{flex:1}
  .modal .box .content{padding:16px 20px}
  .modal .box footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
  .form .full{grid-column:1/-1}
  .form label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
  .form label .req{color:var(--neg)}
  .form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
  .form textarea{min-height:70px;resize:vertical}
  .form input[type=checkbox]{width:auto;margin-right:6px}
  .modal .box.wide{width:min(1000px,100%)}
  .form input:focus,.form select:focus,.form textarea:focus{outline:2px solid #c9d6ea;border-color:#9fb3d1}
  .form .hint{font-size:11.5px;color:var(--muted);margin-top:3px}
  .form fieldset{grid-column:1/-1;border:1px dashed var(--line);border-radius:10px;padding:10px 12px 12px;margin:0}
  .form fieldset legend{font-size:12px;font-weight:700;color:var(--navy2);padding:0 6px}
  .form fieldset .inner{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  @media (max-width:640px){.form,.form fieldset .inner{grid-template-columns:1fr}}
  .drop{border:2px dashed #c7cfdb;border-radius:10px;padding:14px;text-align:center;color:var(--muted);background:#fafbfc}
  .drop.over{border-color:var(--navy2);background:var(--info-bg)}
  .files{margin-top:8px;font-size:12.5px;text-align:left}
  .err{background:var(--neg-bg);color:var(--neg);padding:8px 12px;border-radius:8px;margin-bottom:10px;display:none}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;display:none;box-shadow:var(--shadow)}
  .toast.err{background:var(--neg)}
  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(244,245,247,.75);z-index:70;font-weight:600;color:var(--navy)}
  .spin{width:22px;height:22px;border:3px solid #c9d3e2;border-top-color:var(--navy);border-radius:50%;animation:s 1s linear infinite;margin-right:10px}
  @keyframes s{to{transform:rotate(360deg)}}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .doclink{display:inline-flex;align-items:center;gap:4px;font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:#fff;max-width:240px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px}
    nav .sub,nav .sp,nav .foot{display:none}
    main{padding:16px}
  }
</style>
</head>
<body>
<div class="app">
  <nav id="nav">
    <div class="brand">Klava Private Label</div>
    <div class="sub">Operações no exterior</div>
    <button data-v="painel" title="Painel"><i>◧</i><span>Painel</span></button>
    <button data-v="pedidos" title="Pedidos"><i>▤</i><span>Pedidos</span></button>
    <button data-v="lancamentos" title="Lançamentos"><i>⇄</i><span>Lançamentos</span></button>
    <button data-v="banco" title="Banco"><i>🏦</i><span>Banco</span></button>
    <button data-v="conciliacao" title="Conciliação bancária"><i>⇆</i><span>Conciliação</span></button>
    <button data-v="clientes" title="Clientes"><i>◉</i><span>Clientes</span></button>
    <button data-v="fornecedores" title="Fornecedores"><i>⚙</i><span>Fornecedores</span></button>
    <button data-v="projetos" title="Projetos"><i>◫</i><span>Projetos</span></button>
    <button data-v="documentos" title="Documentos"><i>⎙</i><span>Documentos</span></button>
    <div class="sp"></div>
    <div class="foot" id="foot"></div>
  </nav>
  <main id="main"></main>
</div>

<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div class="spin"></div>Carregando…</div>

<!-- ===== Camada Supabase: login, aprovação de acesso e acesso aos dados (substitui o Apps Script) ===== -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  #auth{position:fixed;inset:0;z-index:100;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:16px}
  #auth.off{display:none}
  #auth .box{background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.25);width:100%;max-width:400px;padding:28px 28px 22px}
  #auth h1{font-size:20px;margin:0 0 2px;color:var(--navy)} #auth .sub{font-size:12px;color:var(--muted);margin-bottom:18px;text-transform:uppercase;letter-spacing:.6px}
  #auth label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  #auth input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit}
  #auth input[type=email]{text-transform:none}
  #auth .btn.pri{width:100%;justify-content:center;margin-top:16px;padding:10px}
  #auth .links{display:flex;justify-content:space-between;margin-top:14px;font-size:12.5px}
  #auth .links a{color:var(--navy2);cursor:pointer}
  #auth .msg{margin-top:12px;font-size:13px;padding:9px 11px;border-radius:8px;display:none}
  #auth .msg.err{display:block;background:var(--neg-bg);color:var(--neg)} #auth .msg.ok{display:block;background:var(--pos-bg);color:var(--pos)}
  #auth p{font-size:14px;line-height:1.5;color:var(--ink)}
  #usrPanel{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:none;padding:22px 28px}
  #usrPanel.on{display:block}
  nav .navx{margin-top:4px}
  nav .navx .cnt{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:auto}
</style>
<script>
(function () {
  var CFG = window.KLAVA_CFG || {};
  var SB = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  window.SB = SB;
  var ctx = { user: null, perfil: null };
  var pronto, prontoP = new Promise(function (r) { pronto = r; });

  /* ---------------- tela de login ---------------- */
  function el(h) { var d = document.createElement('div'); d.innerHTML = h; return d.firstElementChild; }
  function E(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var auth;
  function tela(nome, extra) {
    var head = '<h1>Klava Private Label</h1><div class="sub">Operações no exterior</div>';
    var T = {
      entrar: head + '<form id="fa"><label>E-mail</label><input type="email" name="email" autocomplete="username" required><label>Senha</label><input type="password" name="senha" autocomplete="current-password" required>' +
        '<button class="btn pri">Entrar</button><div class="msg" id="am"></div></form><div class="links"><a data-t="solicitar">Solicitar acesso</a><a data-t="esqueci">Esqueci minha senha</a></div>',
      solicitar: head + '<form id="fa"><label>Nome completo</label><input name="nome" required><label>E-mail</label><input type="email" name="email" autocomplete="username" required>' +
        '<label>Senha (mínimo 8 caracteres)</label><input type="password" name="senha" minlength="8" autocomplete="new-password" required><label>Confirme a senha</label><input type="password" name="senha2" minlength="8" autocomplete="new-password" required>' +
        '<button class="btn pri">Solicitar acesso</button><div class="msg" id="am"></div></form><div class="links"><a data-t="entrar">← Voltar ao login</a></div>',
      esqueci: head + '<form id="fa"><p>Informe seu e-mail. Enviaremos um link para criar uma nova senha.</p><label>E-mail</label><input type="email" name="email" required>' +
        '<button class="btn pri">Enviar link</button><div class="msg" id="am"></div></form><div class="links"><a data-t="entrar">← Voltar ao login</a></div>',
      novaSenha: head + '<form id="fa"><p>Crie sua nova senha.</p><label>Nova senha (mínimo 8 caracteres)</label><input type="password" name="senha" minlength="8" autocomplete="new-password" required><label>Confirme a senha</label><input type="password" name="senha2" minlength="8" required>' +
        '<button class="btn pri">Salvar nova senha</button><div class="msg" id="am"></div></form>',
      pendente: head + '<p>Olá' + (extra && extra.nome ? ', <b>' + E(extra.nome) + '</b>' : '') + '! Sua solicitação de acesso foi recebida e está <b>aguardando aprovação</b>.</p><p style="color:var(--muted)">Assim que for aprovada, é só entrar de novo com seu e-mail e senha.</p><div class="links"><a data-sair>Sair</a><a data-t="recarregar">Verificar de novo</a></div>',
      recusado: head + '<p>Sua solicitação de acesso não foi aprovada. Fale com o administrador do sistema.</p><div class="links"><a data-sair>Sair</a></div>'
    };
    if (!auth) { auth = el('<div id="auth"><div class="box"></div></div>'); document.body.appendChild(auth); }
    auth.classList.remove('off');
    var box = auth.firstElementChild; box.innerHTML = T[nome];
    Array.prototype.forEach.call(box.querySelectorAll('[data-t]'), function (a) { a.onclick = function () { if (a.dataset.t === 'recarregar') location.reload(); else tela(a.dataset.t); }; });
    var f = box.querySelector('#fa'); if (f) { f.onsubmit = function (e) { e.preventDefault(); enviar(nome, f); }; var i = f.querySelector('input'); if (i) i.focus(); }
  }
  function msg(t, ok) { var m = document.getElementById('am'); if (m) { m.className = 'msg ' + (ok ? 'ok' : 'err'); m.textContent = t; } }
  function traduz(e) {
    var s = (e && (e.message || e.error_description)) || String(e);
    if (/Invalid login credentials/i.test(s)) return 'E-mail ou senha incorretos.';
    if (/Email not confirmed/i.test(s)) return 'Confirme seu e-mail pelo link que enviamos antes de entrar.';
    if (/already registered|already been registered/i.test(s)) return 'Este e-mail já tem cadastro. Use "Entrar" ou "Esqueci minha senha".';
    if (/Password should be at least/i.test(s)) return 'A senha precisa ter pelo menos 8 caracteres.';

var NUM = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
/** Valor em tabela: só o número (as tabelas são todas em US$, indicado no título da página). */
function m(v) { v = Number(v) || 0; if (Math.abs(v) < 0.005) return '<span class="muted">–</span>'; return (v < 0 ? '<span class="neg">' : '<span>') + NUM.format(v) + '</span>'; }

function r2(v) { return Math.round((Number(v) || 0) * 100) / 100; }
function uniq(a) { return a.filter(function (x, i) { return x && a.indexOf(x) === i; }).sort(function (a, b) { return String(a).localeCompare(String(b), 'pt'); }); }
function opt(list, sel, blank) { return (blank !== undefined ? '<option value="">' + esc(blank) + '</option>' : '') + list.map(function (o) { var v = typeof o === 'object' ? o.v : o, t = typeof o === 'object' ? o.t : o; return '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join(''); }
function toast(msg, err) { var t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, err ? 6000 : 2800); }
function busy(on, msg) { var l = $('#loading'); l.style.display = on ? 'flex' : 'none'; if (msg) l.lastChild.textContent = msg; }

  d.Lancamentos.forEach(function (l) { (d.lancBy[l.pedido] = d.lancBy[l.pedido] || []).push(l); });

  d.Documentos.forEach(function (x) { d.docById[x.id] = x; if (x.pedido) (d.docBy[x.pedido] = d.docBy[x.pedido] || []).push(x); });

/** Distribui pagamentos de fornecedor entre as linhas de custo do pedido.
 *  1) lançamento com "Orçamento vinculado" (custo_id) vai inteiro para aquela linha;
 *  2) o restante (sem vínculo) é rateado entre as linhas do mesmo fornecedor, pelo saldo em aberto de cada uma. */
function alocar(C, L) {
  var r = {}, livre = {};
  C.forEach(function (c) { r[c.id] = 0; });
  L.forEach(function (l) {
    var v = Number(l.valor) || 0;
    if (l.custo_id && r[l.custo_id] !== undefined) r[l.custo_id] += v;
    else livre[l.fornecedor] = (livre[l.fornecedor] || 0) + v;
  });
  Object.keys(livre).forEach(function (fo) {
    var ls = C.filter(function (c) { return c.fornecedor === fo; }); if (!ls.length) return;
    var ab = ls.map(function (c) { return Math.max(0, Number(c.custo_total) - r[c.id]); });
    var tA = ab.reduce(function (a, x) { return a + x; }, 0);
    var tC = ls.reduce(function (a, c) { return a + Number(c.custo_total); }, 0);
    ls.forEach(function (c, i) { r[c.id] += livre[fo] * (tA ? ab[i] / tA : tC ? Number(c.custo_total) / tC : 1 / ls.length); });
  });
  return r;
}
var PROPRIO = 'Pedido próprio', CLIENTE = 'Pedido cliente';
function isProp(p) { return p && p.tipo === PROPRIO; }
function fin(p) {
  var L = S.d.lancBy[p.codigo] || [], C = S.d.custBy[p.codigo] || [], prop = isProp(p);
  var f = { prop: prop ? 1 : 0, venda: prop ? 0 : Number(p.valor_venda) || 0, rec: 0, recPrev: 0, custo: 0, pago: 0, pagPrev: 0, docs: (S.d.docBy[p.codigo] || []).length, semDoc: 0 };
  C.forEach(function (c) { f.custo += Number(c.custo_total) || 0; });
  L.forEach(function (l) {
    var v = Number(l.valor) || 0, real = l.situacao === 'Realizado';
    if (l.natureza === 'Recebimento') { if (prop) return; if (real) f.rec += v; else f.recPrev += v; }
    else if (l.natureza === 'Pagamento') { if (real) f.pago += v; else f.pagPrev += v; }
    if (real && !String(l.doc_ids || '').trim()) f.semDoc++;
  });
  f.aRec = f.venda - f.rec; f.aPag = f.custo - f.pago;
  f.semParcRec = f.venda - f.rec - f.recPrev; f.semParcPag = f.custo - f.pago - f.pagPrev;
  f.mOk = f.venda > 0.005 && f.custo > 0.005;
  f.margem = f.mOk ? f.venda - f.custo : 0; f.vendaM = f.mOk ? f.venda : 0; f.custoM = f.mOk ? f.custo : 0;
  f.mpct = f.mOk ? f.margem / f.venda : NaN; f.caixa = f.rec - f.pago;
  f.semCusto = f.venda > 0.005 && !f.custo ? 1 : 0; f.semVenda = !prop && f.custo > 0.005 && !f.venda ? 1 : 0;
  if (prop) { f.aRec = 0; f.semParcRec = 0; }
  var st = [];
  if (p.etapa === 'Cancelado') st.push(['Cancelado', '']);
  else {
    if (f.aRec > 0.01) st.push(['A receber', 'b-warn']);
    if (f.aRec < -0.01) st.push(['Recebido a mais', 'b-neg']);
    if (f.aPag > 0.01) st.push(['A pagar', 'b-info']);
    if (f.aPag < -0.01) st.push(['Pago a mais', 'b-neg']);
    if (!st.length && (f.venda || f.custo)) st.push([prop ? 'Pago' : 'Quitado', 'b-pos']);
    if (!f.venda && !f.custo) st.push([prop ? 'Sem custo' : 'Sem valores', '']);
  }
  f.status = st; f.statusTxt = st.map(function (x) { return x[0]; }).join(' / ');
  return f;
}

function sumF(list) {
  var t = { venda: 0, rec: 0, recPrev: 0, custo: 0, pago: 0, pagPrev: 0, aRec: 0, aPag: 0, margem: 0, vendaM: 0, custoM: 0, semCusto: 0, semVenda: 0, caixa: 0, semParcRec: 0, semParcPag: 0, n: 0, semDoc: 0 };
  list.forEach(function (p) { Object.keys(t).forEach(function (k) { if (k !== 'n') t[k] += p.f[k] || 0; }); t.n++; });
  t.mpct = t.vendaM ? t.margem / t.vendaM : NaN;
  return t;
}
/** Margem só é calculada para pedidos com venda E custo lançados; o resto é sinalizado. */
function mc(x) {
  var notes = [];
  if (x.semCusto) notes.push(x.n > 1 ? x.semCusto + ' sem custo' : 'sem custo');
  if (x.semVenda) notes.push(x.n > 1 ? x.semVenda + ' sem venda' : 'sem venda');
  var h = x.vendaM > 0 ? m(x.margem) : (notes.length ? '' : '<span class="muted">–</span>');
  if (notes.length) h += (h ? '<br>' : '') + '<span class="badge" title="Fora do cálculo de margem">' + esc(notes.join(' · ')) + '</span>';
  return h;
}
function mp(x) { return x.vendaM > 0 && isFinite(x.mpct) ? pct(x.mpct) : '<span class="muted">–</span>'; }
function tipoBadge(p) { return isProp(p) ? '<span class="badge b-prop" title="Compra da Klava (sem venda a cliente)">Próprio</span>' : ''; }
function badges(st) { return st.map(function (x) { return '<span class="badge ' + x[1] + '">' + esc(x[0]) + '</span>'; }).join(' '); }
function etapaBadge(e) { var c = { 'Concluído': 'b-pos', 'Cancelado': '', 'Em negociação': '', 'Confirmado': 'b-info', 'Em produção': 'b-warn', 'Embarcado': 'b-info', 'Entregue': 'b-pos' }[e]; return e ? '<span class="badge ' + (c || '') + '">' + esc(e) + '</span>' : ''; }
function clienteDe(codigo) { var p = S.d.ped[codigo]; return p ? p.cliente : ''; }
function anoDe(p) { return (p.data_pedido || '').slice(0, 4) || 's/ data'; }

function go(view, filters) { S.view = view; S.f[view] = Object.assign({}, S.f[view] || {}, filters || {}); render(); }
function fv(view, k, def) { return (S.f[view] || {})[k] !== undefined ? S.f[view][k] : (def || ''); }
function bindFilters(view) {
  $$('[data-f]').forEach(function (el) {
    if (el.type === 'date') {
      var aplica = function () {
        var v = el.value; if (v && !(Number(v.slice(0, 4)) >= 1990 && Number(v.slice(0, 4)) <= 2100)) return;   // ano ainda sendo digitado
        S.f[view] = S.f[view] || {}; if ((S.f[view][el.dataset.f] || '') === v) return;
        var foco = document.activeElement === el, id = el.dataset.f;
        S.f[view][el.dataset.f] = v; render();
        if (foco) { var n = $('[data-f="' + id + '"]'); if (n) n.focus(); }
      };
      el.oninput = el.onchange = function () { clearTimeout(el._t); el._t = setTimeout(aplica, 900); };
      el.onblur = function () { clearTimeout(el._t); aplica(); };
      el.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); aplica(); } };
      return;
    }
    el.oninput = el.onchange = function () {
      S.f[view] = S.f[view] || {}; S.f[view][el.dataset.f] = el.value;
      var pos = el.selectionStart; var id = el.dataset.f;
      render(); var n = $('[data-f="' + id + '"]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
    };
  });
}
function bindView() {

  $$('[data-act]').forEach(function (el) { el.onclick = function (e) { e.stopPropagation(); if (el.tagName === 'A') e.preventDefault(); ACT[el.dataset.act](el.dataset); }; });
}

  h += '<div class="grid kpis row" style="--n:6">' +
    kpi('Vendido (pedidos)', mt(t.venda), t.n + ' pedidos de clientes') +
    kpi('Custo de produção', mt(t.custo), 'pedidos de clientes') +
    kpi('Margem bruta', mt(t.margem), pct(t.mpct) + (t.semCusto || t.semVenda ? ' · ' + (t.semCusto + t.semVenda) + ' pedidos fora do cálculo' : '')) +
    kpi('Saldo a receber', mt(t.aRec), 'vendido − recebido') +
    kpi('Saldo a pagar', mt(tAll.aPag), 'custo − pago (clientes ' + mt(t.aPag) + ' · próprios ' + mt(tp.aPag) + ')') +

  h += '<div class="section"><h2>Pedidos de clientes por cliente <span class="c">clique para ver os pedidos</span></h2><div class="card tbl short"><table><thead><tr><th>Cliente</th><th class="n">Pedidos</th><th class="n">Vendido</th><th class="n">Recebido</th><th class="n">A receber</th><th class="n">Custo</th><th class="n">Pago</th><th class="n">A pagar</th><th class="n">Margem</th><th class="n">Margem %</th></tr></thead><tbody>' +

    '</tbody></table></div></div>' +

    '<div style="margin-top:10px"><button class="btn sm" data-act="verSemDoc">Ver lista</button></div></div></div></div>';

}
/** Os 4 cards de movimentação (Lançamentos e Painel usam a mesma conta). */
function lancCards(list) {
  var k = { rr: [0, 0, 0], rp: [0, 0, 0], pr: [0, 0, 0], pp: [0, 0, 0] };
  list.forEach(function (l) { var key = (l.natureza === 'Recebimento' ? 'r' : 'p') + (l.situacao === 'Realizado' ? 'r' : 'p'), v = Number(l.valor) || 0; k[key][0] += v; k[key][1]++; if (isProp(S.d.ped[l.pedido])) k[key][2] += v; });
  var card = function (cls, lb, x) {

function natDe(t) {
  t = String(t || '').trim().toUpperCase();
  if (/^(RECEBIDO|A RECEBER|PROGRAMADO RECEBER|RECEBIMENTO)/.test(t)) return 'cr';
  if (/^(PAGO|A PAGAR|PROGRAMADO PAGAR|PAGAMENTO)/.test(t) || t === 'PROGRAMADO') return 'db';
  return '';

  $$('table', root).forEach(function (tb) {
    var ths = $$('thead th', tb); if (!ths.length) return;
    var cls = ths.map(function (th) { return natDe(th.textContent); });
    if (!cls.some(Boolean)) return;
    $$('tbody tr', tb).forEach(function (tr) {
      if (tr.classList.contains('cr') || tr.classList.contains('db')) return;

var CONC = (function () {
  var STOP = { LTD: 1, LIMITED: 1, CO: 1, COMPANY: 1, SA: 1, 'S/A': 1, INC: 1, LLC: 1, CORP: 1, CORPORATION: 1, GROUP: 1, INDUSTRIA: 1, INDUSTRIAL: 1, COMERCIO: 1,

    filtPedidos().forEach(function (p) { var f = p.f; rows.push([p.codigo, isProp(p) ? PROPRIO : CLIENTE, p.cliente, p.projeto, p.conta, p.data_pedido, p.etapa, p.categoria, p.qtde, f.venda, f.rec, f.recPrev, f.aRec, f.custo, f.pago, f.pagPrev, f.aPag, f.mOk ? f.margem : '', f.statusTxt]); });
    csv(rows, 'pedidos_private_label.csv');
  },
  exportLanc: function () {
    var rows = [['ID', 'Data', 'Natureza', 'Pedido', 'Cliente', 'Fornecedor', 'Parcela', 'Valor', 'Situação', 'Banco', 'Referência', 'Documentos', 'Obs']];
    S.d.Lancamentos.forEach(function (l) { rows.push([l.id, l.data, l.natureza, l.pedido, clienteDe(l.pedido), l.fornecedor, l.parcela, l.valor, l.situacao, l.banco, l.referencia, l.doc_ids, l.obs]); });
    csv(rows, 'lancamentos_private_label.csv');
  }
};
function csv(rows, name) {
  var txt = rows.map(function (r) { return r.map(function (v) { v = v == null ? '' : (typeof v === 'number' ? String(r2(v)).replace('.', ',') : String(v)); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';'); }).join('\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + txt], { type: 'text/csv;charset=utf-8' })); a.download = name; a.click();
}
